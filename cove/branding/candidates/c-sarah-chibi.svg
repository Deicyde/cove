<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#efe3f2"/>
      <stop offset="60%" stop-color="#dcc9e6"/>
      <stop offset="100%" stop-color="#c3a9d6"/>
    </radialGradient>
    <linearGradient id="hairC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a97ec9"/>
      <stop offset="100%" stop-color="#7d51a8"/>
    </linearGradient>
    <clipPath id="roundC"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#roundC)">
    <rect width="512" height="512" fill="url(#bgC)"/>
    <!-- sparkles -->
    <g fill="#ffffff" opacity="0.8">
      <path d="M108 120 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
      <path d="M410 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
      <circle cx="90" cy="300" r="5"/>
      <circle cx="430" cy="330" r="6"/>
    </g>

    <!-- body shadow -->
    <ellipse cx="256" cy="452" rx="120" ry="26" fill="#7d51a8" opacity="0.25"/>

    <!-- chibi body -->
    <g>
      <!-- dress -->
      <path d="M188 388 q68 -34 136 0 l14 70 q-82 30 -164 0 z" fill="#5b4470"/>
      <rect x="214" y="352" width="84" height="52" rx="20" fill="#e7b48c"/>
      <!-- collar -->
      <path d="M206 356 q50 34 100 0 l-6 22 q-44 26 -88 0 z" fill="#f4d6e4"/>

      <!-- head -->
      <circle cx="256" cy="264" r="112" fill="#e7b48c"/>
      <!-- hair back + sides -->
      <path d="M144 262 q-6 -128 112 -132 q118 4 112 132 q-4 44 -22 74 q6 -70 -18 -110 q-30 40 -72 40 q-42 0 -72 -40 q-24 40 -18 110 q-18 -30 -22 -74 z" fill="url(#hairC)"/>
      <!-- grape puff -->
      <g fill="#8a5cc0">
        <circle cx="120" cy="212" r="20"/>
        <circle cx="104" cy="238" r="18"/>
        <circle cx="132" cy="242" r="17"/>
        <circle cx="116" cy="266" r="15"/>
      </g>
      <!-- beret -->
      <path d="M150 196 q106 -74 212 -8 q10 30 -18 40 q-92 -44 -176 6 q-26 -8 -18 -38 z" fill="#2c2634"/>
      <circle cx="360" cy="182" r="10" fill="#4a4056"/>

      <!-- face -->
      <!-- eyes -->
      <ellipse cx="214" cy="284" rx="26" ry="32" fill="#ffffff"/>
      <ellipse cx="300" cy="284" rx="26" ry="32" fill="#ffffff"/>
      <circle cx="216" cy="290" r="17" fill="#3a2f28"/>
      <circle cx="302" cy="290" r="17" fill="#3a2f28"/>
      <circle cx="216" cy="290" r="8" fill="#f2c744"/>
      <circle cx="302" cy="290" r="8" fill="#f2c744"/>
      <circle cx="210" cy="282" r="6" fill="#ffffff"/>
      <circle cx="296" cy="282" r="6" fill="#ffffff"/>
      <!-- brows -->
      <ellipse cx="212" cy="248" rx="14" ry="7" fill="#7d51a8" transform="rotate(-8 212 248)"/>
      <ellipse cx="302" cy="248" rx="14" ry="7" fill="#7d51a8" transform="rotate(8 302 248)"/>
      <!-- nose + blush + smile -->
      <ellipse cx="257" cy="308" rx="7" ry="9" fill="#c98a5e"/>
      <ellipse cx="182" cy="318" rx="18" ry="11" fill="#ff9ab0" opacity="0.55"/>
      <ellipse cx="332" cy="318" rx="18" ry="11" fill="#ff9ab0" opacity="0.55"/>
      <path d="M234 330 q23 20 46 0" stroke="#8a5a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- tiny terminal she holds -->
    <g transform="rotate(-10 330 404)">
      <rect x="292" y="366" width="92" height="78" rx="16" fill="#73d9ff"/>
      <rect x="298" y="372" width="80" height="66" rx="11" fill="#1b1f25"/>
      <rect x="306" y="388" width="64" height="42" rx="8" fill="#101317"/>
      <path d="M314 400 l10 8 -10 8" stroke="#ffd68a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="332" y="412" width="20" height="6" rx="3" fill="#ffd68a"/>
    </g>
  </g>
</svg>
